<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="mobile-web-app-capable" content="yes">
<title>海外流媒体更新</title>
<!-- iOS 26+: a web-app manifest or apple-mobile-web-app-* metas put home-screen apps on WebKit's legacy
     standalone path, whose web view is one status-bar height too short, leaving an unpaintable black strip
     under the tab bar. iOS opens Home Screen sites full-screen without them, so only non-iOS gets the manifest. -->
<script>(function(){var ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
if(!ios){var l=document.createElement('link');l.rel='manifest';l.href='manifest.webmanifest';document.head.appendChild(l);}})();</script>
<!-- Legacy iOS standalone path (icon added while the page had black-translucent/manifest): WebKit lays the page out
     in a viewport that starts at the top of the screen but is one status-bar height short, so position:fixed;bottom:0
     stops above the real screen edge. Detect exactly that signature and push bottom-anchored UI down by the gap. -->
<script>(function(){var d=document.documentElement;
function fix(){var st=navigator.standalone===true||matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches;
var g=0;if(st&&matchMedia('(orientation: portrait)').matches&&document.body){var pr=document.createElement('div');
pr.style.cssText='position:absolute;visibility:hidden;padding-top:env(safe-area-inset-top,0px)';document.body.appendChild(pr);
var top=parseFloat(getComputedStyle(pr).paddingTop)||0;pr.remove();var h=Math.max(screen.height,screen.width),gap=h-innerHeight;
if(top>20&&gap>20&&Math.abs(gap-top)<=6)g=gap;}
d.style.setProperty('--gap',g+'px');d.classList.toggle('gapfix',g>0);}
document.addEventListener('DOMContentLoaded',fix);addEventListener('resize',fix);addEventListener('orientationchange',function(){setTimeout(fix,300)});
addEventListener('pageshow',fix);if(window.visualViewport)visualViewport.addEventListener('resize',fix);})();</script>
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top" id="top">
  <div class="top-in">
    <div class="ttl"><div class="kick" id="kick">海外流媒体更新</div><h1 id="ttl">本周更新</h1></div>
    <button class="ibtn" id="btnSearch" aria-label="搜索"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
  </div>
</header>

<main id="views">
  <section class="view" id="v-weekly"></section>
  <section class="view" id="v-year"></section>
  <section class="view" id="v-apple"></section>
  <section class="view" id="v-save"></section>
</main>

<nav class="tabbar" id="tabbar">
  <button data-tab="weekly" class="on"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="15" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg><span>本周更新</span></button>
  <button data-tab="year"><svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg><span>年度片单</span></button>
  <button data-tab="apple"><svg viewBox="0 0 24 24"><path d="M16.4 12.6c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9s-1.8-.9-3-.8C7 7.4 5.6 8.3 4.8 9.7c-1.6 2.8-.4 6.9 1.2 9.1.8 1.1 1.7 2.3 2.8 2.3 1.1 0 1.6-.7 3-.7s1.8.7 3 .7 2-1.1 2.7-2.2c.9-1.3 1.2-2.5 1.2-2.6 0 0-2.3-.9-2.3-3.7zM14.2 5.8c.6-.8 1-1.8.9-2.8-.9 0-2 .6-2.6 1.4-.6.7-1.1 1.7-.9 2.7 1 .1 2-.5 2.6-1.3z"/></svg><span>Apple TV+ 精选</span></button>
  <button data-tab="save"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15 9.5c-.5-1-1.6-1.5-3-1.5-1.7 0-3 .8-3 2s1.2 1.7 3 2 3 .8 3 2-1.3 2-3 2c-1.4 0-2.6-.6-3-1.6M12 6v2M12 16v2"/></svg><span>省钱攻略</span></button>
</nav>

<div class="search" id="search" aria-hidden="true">
  <div class="s-bar">
    <div class="s-in"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="搜索片名、演员、关键词" autocomplete="off"></div>
    <button class="s-x" id="sClose">取消</button>
  </div>
  <div class="s-res" id="sRes"></div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grab" id="grab"><i></i></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="a2hs" id="a2hs"><div class="a2hs-in"><b>添加到主屏幕，全屏使用</b><p>点底部的 <svg viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg> 分享 → 「添加到主屏幕」，之后就像 App 一样打开</p></div><button id="a2hsX" aria-label="关闭">知道了</button></div>
<script src="app.js"></script>
</body>
</html>
